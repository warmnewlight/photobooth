<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daniel & Alicia's Photo Booth</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #camera-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 4/5;
      background: #000;
      overflow: hidden;
    }

    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 10;
    }

    #photo-preview {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 20;
    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      padding: 0 15px 20px;
      width: 100%;
      max-width: 500px;
    }

    button, .btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 15px 20px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      flex-grow: 1;
      max-width: 48%;
    }

    /* Distinct styling for the secondary buttons */
    #flip-btn, #change-frame-btn {
      background-color: #444444;
      color: white;
    }

    /* Make the snap button span full width for emphasis */
    #snap-btn {
      max-width: 100%;
      flex-basis: 100%;
      padding: 18px 20px;
      background-color: #ffffff;
    }

    button:active, .btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <!-- Starts with frame1.png by default -->
    <img id="frame" src="frame1.png" alt="Wedding Frame" />
    <img id="photo-preview" alt="Captured Photo" />
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div id="controls">
    <button id="flip-btn">Flip Camera</button>
    <button id="change-frame-btn">Change Frame</button>
    <button id="snap-btn">Snap Photo</button>
    
    <button id="retake-btn" style="display:none;">Retake</button>
    <a id="download-btn" class="btn" style="display:none;" download="wedding_photo.png">Save Photo</a>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const frameElement = document.getElementById('frame');
    const snapBtn = document.getElementById('snap-btn');
    const flipBtn = document.getElementById('flip-btn');
    const changeFrameBtn = document.getElementById('change-frame-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const downloadBtn = document.getElementById('download-btn');
    const photoPreview = document.getElementById('photo-preview');

    let currentStream = null;
    
    // Arrays to hold all available lenses and our current position
    let videoDevices = [];
    let currentDeviceIndex = 0;

    // --- NEW: Frame Selection Logic ---
    // List all your frame filenames here. You can add as many as you want!
    const frames = ['frame1.png', 'frame2.png', 'frame3.png','frame4.png', 'frame5.png', 'frame6.png', 'frame7.png', 'frame8.png'];
    let currentFrameIndex = 0;

    changeFrameBtn.addEventListener('click', () => {
      currentFrameIndex = (currentFrameIndex + 1) % frames.length;
      frameElement.src = frames[currentFrameIndex];
    });

    // 1. Find all cameras on the phone
    async function getCameras() {
      try {
        // We must request basic camera access first, otherwise the browser hides the device names for privacy
        await navigator.mediaDevices.getUserMedia({ video: true });
        
        // Ask the phone to list every piece of media hardware it has
        const devices = await navigator.mediaDevices.enumerateDevices();
        
        // Filter out microphones and speakers, keeping only the camera lenses
        videoDevices = devices.filter(device => device.kind === 'videoinput');
        
        // Start the camera with the first lens in the list
        if (videoDevices.length > 0) {
          startCamera(videoDevices[currentDeviceIndex].deviceId);
        }
      } catch (err) {
        alert("Camera access is required to use the photo booth!");
        console.error("Device enumeration error:", err);
      }
    }

    // 2. Start a specific camera using its exact hardware ID
    async function startCamera(deviceId) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: { deviceId: { exact: deviceId } },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        
        // Check if the currently selected lens is a front-facing selfie camera
        // so we can mirror it properly. (Usually, the label contains 'front' or 'user')
        const currentDevice = videoDevices[currentDeviceIndex];
        const isFrontCamera = currentDevice.label.toLowerCase().includes('front');
        
        if (isFrontCamera) {
          video.style.transform = "scaleX(-1)";
        } else {
          video.style.transform = "scaleX(1)";
        }
      } catch (err) {
        console.error("Camera start error:", err);
      }
    }

    // 3. Cycle to the next available lens when the button is clicked
    flipBtn.addEventListener('click', () => {
      if (videoDevices.length > 1) {
        currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
        startCamera(videoDevices[currentDeviceIndex].deviceId);
      }
    });

    // 4. Take the photo
    snapBtn.addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      const currentDevice = videoDevices[currentDeviceIndex];
      const isFrontCamera = currentDevice.label.toLowerCase().includes('front');

      // Mirror the saved photo if it's a selfie camera
      if (isFrontCamera) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      } else {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }
      
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(frameElement, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL('image/png');
      photoPreview.src = dataUrl;
      downloadBtn.href = dataUrl;

      video.style.display = 'none';
      frameElement.style.display = 'none';
      photoPreview.style.display = 'block';
      
      snapBtn.style.display = 'none';
      flipBtn.style.display = 'none';
      changeFrameBtn.style.display = 'none';
      retakeBtn.style.display = 'block';
      downloadBtn.style.display = 'block';
    });

    // 5. Reset for another photo
    retakeBtn.addEventListener('click', () => {
      video.style.display = 'block';
      frameElement.style.display = 'block';
      photoPreview.style.display = 'none';

      snapBtn.style.display = 'block';
      flipBtn.style.display = 'block';
      changeFrameBtn.style.display = 'block';
      retakeBtn.style.display = 'none';
      downloadBtn.style.display = 'none';
    });

    // Kick off the whole process by finding the cameras when the page loads
    getCameras();    // Start the camera immediately when the page loads
  </script>
</body>
</html>
