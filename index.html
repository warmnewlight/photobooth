<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daniel & Alicia's Photo Booth</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #camera-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 3/4;
      background: #000;
      overflow: hidden;
    }

    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* The transform scaleX is now handled dynamically in JavaScript */
    }

    #frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 10;
    }

    #photo-preview {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 20;
    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      padding: 0 15px 20px;
    }

    button, .btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 15px 25px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      flex-grow: 1;
      max-width: 200px;
    }

    /* Distinct styling for the flip button */
    #flip-btn {
      background-color: #444444;
      color: white;
    }

    button:active, .btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <img id="frame" src="frame.png" alt="Wedding Frame" />
    <img id="photo-preview" alt="Captured Photo" />
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div id="controls">
    <button id="flip-btn">Flip Camera</button>
    <button id="snap-btn">Snap Photo</button>
    <button id="retake-btn" style="display:none;">Retake</button>
    <a id="download-btn" class="btn" style="display:none;" download="wedding_photo.png">Save Photo</a>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const frame = document.getElementById('frame');
    const snapBtn = document.getElementById('snap-btn');
    const flipBtn = document.getElementById('flip-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const downloadBtn = document.getElementById('download-btn');
    const photoPreview = document.getElementById('photo-preview');

    let useFrontCamera = true;
    let currentStream = null;

    // 1. Request access to the camera and handle switching
    async function startCamera() {
      // Stop the existing camera stream before switching
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: { facingMode: useFrontCamera ? "user" : "environment" },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        
        // Mirror the live video feed ONLY if using the front selfie camera
        if (useFrontCamera) {
          video.style.transform = "scaleX(-1)";
        } else {
          video.style.transform = "scaleX(1)";
        }
      } catch (err) {
        alert("Unable to switch cameras. Please check permissions.");
        console.error("Camera error:", err);
      }
    }

    // 2. Flip Camera button listener
    flipBtn.addEventListener('click', () => {
      useFrontCamera = !useFrontCamera;
      startCamera();
    });

    // 3. Take the photo and merge the video + frame
    snapBtn.addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      // Apply mirroring to the final saved image ONLY if using the front camera
      if (useFrontCamera) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      } else {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }
      
      // Draw the video frame
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Reset the mirror effect BEFORE drawing the transparent frame
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      // Draw the transparent PNG frame on top
      ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL('image/png');
      photoPreview.src = dataUrl;
      downloadBtn.href = dataUrl;

      // Update the interface
      video.style.display = 'none';
      frame.style.display = 'none';
      photoPreview.style.display = 'block';
      
      snapBtn.style.display = 'none';
      flipBtn.style.display = 'none';
      retakeBtn.style.display = 'block';
      downloadBtn.style.display = 'block';
    });

    // 4. Reset everything for another photo
    retakeBtn.addEventListener('click', () => {
      video.style.display = 'block';
      frame.style.display = 'block';
      photoPreview.style.display = 'none';

      snapBtn.style.display = 'block';
      flipBtn.style.display = 'block';
      retakeBtn.style.display = 'none';
      downloadBtn.style.display = 'none';
    });

    // Start the camera immediately when the page loads
    startCamera();
  </script>
</body>
</html>
