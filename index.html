<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daniel & Alicia's Photo Booth</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #camera-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 4/5;
      background: #000;
      overflow: hidden;
    }

    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 10;
    }

    #photo-preview {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 20;
    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      padding: 0 15px 20px;
      width: 100%;
      max-width: 500px;
    }

    button, .btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 15px 20px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      flex-grow: 1;
      max-width: 48%;
    }

    /* Distinct styling for the secondary buttons */
    #flip-btn, #change-frame-btn {
      background-color: #444444;
      color: white;
    }

    /* Make the snap button span full width for emphasis */
    #snap-btn {
      max-width: 100%;
      flex-basis: 100%;
      padding: 18px 20px;
      background-color: #ffffff;
    }

    button:active, .btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <!-- Starts with frame1.png by default -->
    <img id="frame" src="frame1.png" alt="Wedding Frame" />
    <img id="photo-preview" alt="Captured Photo" />
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div id="controls">
    <button id="flip-btn">Flip Camera</button>
    <button id="change-frame-btn">Change Frame</button>
    <button id="snap-btn">Snap Photo</button>
    
    <button id="retake-btn" style="display:none;">Retake</button>
    <button id="download-btn" style="display:none;">Save/Share Photo</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const frameElement = document.getElementById('frame');
    const snapBtn = document.getElementById('snap-btn');
    const flipBtn = document.getElementById('flip-btn');
    const changeFrameBtn = document.getElementById('change-frame-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const downloadBtn = document.getElementById('download-btn');
    const photoPreview = document.getElementById('photo-preview');

    let useFrontCamera = true;
    let currentStream = null;

    // --- NEW: Frame Selection Logic ---
    // List all your frame filenames here. You can add as many as you want!
    const frames = ['frame1.png', 'frame2.png','frame4.png', 'frame5.png', 'frame6.png','frame7.png', 'frame8.png'];
    let currentFrameIndex = 0;

    changeFrameBtn.addEventListener('click', () => {
      // Move to the next frame, and loop back to 0 if at the end of the list
      currentFrameIndex = (currentFrameIndex + 1) % frames.length;
      frameElement.src = frames[currentFrameIndex];
    });
    // ----------------------------------

    // 1. Request access to the camera and handle switching
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      // Tell the browser we want the highest resolution possible
      const constraints = {
        video: { 
          facingMode: useFrontCamera ? "user" : "environment",
          width: { ideal: 2160 },
          height: { ideal: 2700 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        
        if (useFrontCamera) {
          video.style.transform = "scaleX(-1)";
        } else {
          video.style.transform = "scaleX(1)";
        }
      } catch (err) {
        alert("Unable to switch cameras. Please check permissions.");
        console.error("Camera error:", err);
      }
    }

    // 2. Flip Camera button listener
    flipBtn.addEventListener('click', () => {
      useFrontCamera = !useFrontCamera;
      startCamera();
    });

    // 3. Take the photo and merge the video + frame
    snapBtn.addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      if (useFrontCamera) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      } else {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }
      
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      
      // Draws whichever frame is currently selected
      ctx.drawImage(frameElement, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL('image/png');
      photoPreview.src = dataUrl;
      downloadBtn.href = dataUrl;

      // Update the interface
      video.style.display = 'none';
      frameElement.style.display = 'none';
      photoPreview.style.display = 'block';
      
      snapBtn.style.display = 'none';
      flipBtn.style.display = 'none';
      changeFrameBtn.style.display = 'none';
      retakeBtn.style.display = 'block';
      downloadBtn.style.display = 'block';
    });

    // 4. Reset everything for another photo
    retakeBtn.addEventListener('click', () => {
      video.style.display = 'block';
      frameElement.style.display = 'block';
      photoPreview.style.display = 'none';

      snapBtn.style.display = 'block';
      flipBtn.style.display = 'block';
      changeFrameBtn.style.display = 'block';
      retakeBtn.style.display = 'none';
      downloadBtn.style.display = 'none';
    });
// Helper function to convert the canvas data into a real file
    function dataURLtoFile(dataurl, filename) {
      let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
          bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
      while(n--){
          u8arr[n] = bstr.charCodeAt(n);
      }
      return new File([u8arr], filename, {type:mime});
    }

    // Helper function to convert the canvas data into a real file (Needed for iOS sharing)
    function dataURLtoFile(dataurl, filename) {
      let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
          bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
      while(n--){
          u8arr[n] = bstr.charCodeAt(n);
      }
      return new File([u8arr], filename, {type:mime});
    }

    // New Hybrid Save Logic
    downloadBtn.addEventListener('click', async () => {
      const dataUrl = canvas.toDataURL('image/png');
      
      // Check if the device is Android
      const isAndroid = /Android/i.test(navigator.userAgent);

      if (isAndroid) {
        // ANDROID BEHAVIOR: Instant direct download
        const link = document.createElement('a');
        link.download = 'DA_Wedding_Photo.png';
        link.href = dataUrl;
        link.click();
      } else {
        // APPLE/OTHER BEHAVIOR: Trigger the native Share Sheet so it goes to the Camera Roll
        const file = dataURLtoFile(dataUrl, 'DA_Wedding_Photo.png');

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Daniel & Alicia Photo Booth',
              text: 'Our photo from Daniel & Alicia\'s Wedding!'
            });
          } catch (err) {
            console.log('Share canceled or failed', err);
          }
        } else {
          // Fallback if sharing is unavailable
          alert("To save: Tap and hold the photo, then select 'Save to Photos'.");
        }
      }
    });
    // Start the camera immediately when the page loads
    startCamera();
  </script>
</body>
</html>
